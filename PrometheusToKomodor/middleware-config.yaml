# Alertmanager -> internal adapter service -> Komodor Custom Events
#
# Use this configuration when:
# - Alertmanager is too old for webhook_configs[].payload.
# - Alertmanager cannot safely configure the x-api-key header.
# - You want the adapter to validate, enrich, retry, or log delivery failures.
#
# Contract:
# - Alerts sent to this receiver MUST include labels.cluster.
# - labels.namespace and labels.service are optional but strongly recommended.
# - The adapter skips alerts without labels.cluster.

---
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - cluster
    - namespace
    - service

  routes:
    - receiver: komodor-adapter
      matchers:
        - cluster=~".+"
      group_by:
        - alertname
        - cluster
        - namespace
        - service
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      continue: true

receivers:
  - name: default

  - name: komodor-adapter
    webhook_configs:
      - url: http://middleware:8080/alertmanager
        send_resolved: true
        max_alerts: 1

---
apiVersion: v1
kind: Secret
metadata:
  name: komodor-api
  namespace: monitoring
type: Opaque
stringData:
  api-key: replace-me

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-komodor-adapter
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager-komodor-adapter
  template:
    metadata:
      labels:
        app: alertmanager-komodor-adapter
    spec:
      containers:
        - name: adapter
          image: ghcr.io/example/alertmanager-komodor-adapter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KOMODOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: komodor-api
                  key: api-key
            - name: KOMODOR_API_URL
              value: https://api.komodor.com/mgmt/v1/events
            - name: REQUEST_TIMEOUT
              value: 10s
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-komodor-adapter
  namespace: monitoring
spec:
  selector:
    app: alertmanager-komodor-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http

# Example Prometheus external_labels configuration:
